name: Check GAS Secret

on:
  push:
    branches:
      - gas-candidate-20260820
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  EXPECTED_SCRIPT_ID: 19qIN0cXmBY9GY7ma8B2MJh25ioBsmrlrIwsr27ZB1oyFxH8VPMj0dmhM
  CLASP_VERSION: 3.3.0

jobs:
  check-secret:
    name: Check clasp OAuth secret only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@google/clasp@${CLASP_VERSION}"
          clasp --version
      - name: Install secret
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "::error::Missing CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8').replace(/^\uFEFF/,''));"
          echo "SECRET_FORMAT=PASS"
      - name: Verify authorization and project visibility
        shell: bash
        run: |
          set -euo pipefail
          clasp show-authorized-user --json
          LIST_OUTPUT="$(clasp list-scripts)"
          printf '%s\n' "$LIST_OUTPUT"
          if ! printf '%s\n' "$LIST_OUTPUT" | grep -Fq "$EXPECTED_SCRIPT_ID"; then
            echo "::error::Expected Apps Script project is not visible to this credential"
            exit 1
          fi
          echo "SECRET_AUTH=PASS"
          echo "SCRIPT_TARGET=PASS"

name: P0 Trigger Discovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

env:
  SCRIPT_ID: 19qIN0cXmBY9GY7ma8B2MJh25ioBsmrlrIwsr27ZB1oyFxH8VPMj0dmhM
  CLASP_VERSION: 3.3.0
  STATUS_ISSUE: '2'

jobs:
  discover-triggers:
    name: Discover recent GAS trigger executions
    if: ${{ github.head_ref == 'gas-p0-runtime-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp credential and query Apps Script processes
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --global "@google/clasp@${CLASP_VERSION}" >/dev/null
          test -n "${CLASPRC_JSON:-}"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

          ACCESS_TOKEN="$(node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.env.HOME+'/.clasprc.json','utf8').replace(/^\uFEFF/,''));
          function find(v){
            if (!v || typeof v!=='object') return '';
            for (const [k,x] of Object.entries(v)) {
              if ((k==='access_token' || k==='accessToken') && typeof x==='string' && x) return x;
            }
            for (const x of Object.values(v)) { const r=find(x); if(r) return r; }
            return '';
          }
          process.stdout.write(find(j));
          NODE
          )"
          test -n "$ACCESS_TOKEN"

          HTTP="$(curl -sS -G -o /tmp/processes.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "scriptId=$SCRIPT_ID" \
            --data-urlencode "pageSize=100" \
            'https://script.googleapis.com/v1/processes:listScriptProcesses')"

          node <<'NODE' >/tmp/process-summary.txt
          const fs=require('fs');
          let j={};
          try { j=JSON.parse(fs.readFileSync('/tmp/processes.json','utf8')); } catch(e) {}
          if (j.error) {
            console.log('API_ERROR='+String(j.error.status||'UNKNOWN')+':'+String(j.error.message||''));
            process.exit(0);
          }
          const ps=j.processes||[];
          console.log('PROCESS_COUNT='+ps.length);
          const rows=ps.map(p=>({
            functionName:p.functionName||'',
            processType:p.processType||'',
            processStatus:p.processStatus||'',
            startTime:p.startTime||'',
            duration:p.duration||''
          }));
          rows.slice(0,100).forEach(r=>console.log([r.startTime,r.functionName,r.processType,r.processStatus,r.duration].join('\t')));
          NODE

          SUMMARY="$(cat /tmp/process-summary.txt)"
          BODY="$(cat <<EOF
          P0=TRIGGER_DISCOVERY
          HTTP=$HTTP
          COMMIT=$GITHUB_SHA
          SUMMARY_BEGIN
          $SUMMARY
          SUMMARY_END
          EOF
          )"
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          printf '%s\n' "$BODY"

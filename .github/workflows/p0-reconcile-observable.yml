name: P0 GCP Project Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

env:
  SCRIPT_ID: 19qIN0cXmBY9GY7ma8B2MJh25ioBsmrlrIwsr27ZB1oyFxH8VPMj0dmhM
  PROJECT_ID: tonkhohd
  PROJECT_NUMBER: '587745071207'
  CLASP_VERSION: 3.3.0
  STATUS_ISSUE: '2'

jobs:
  gcp-probe:
    name: Read-only verify tonkhohd project and Apps Script API
    if: ${{ github.head_ref == 'gas-p0-runtime-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Google Cloud verification
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --global "@google/clasp@${CLASP_VERSION}" >/dev/null
          test -n "${CLASPRC_JSON:-}"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

          PROBE="$RUNNER_TEMP/gcp-project-probe"
          rm -rf "$PROBE"
          mkdir -p "$PROBE"
          cd "$PROBE"
          clasp clone-script "$SCRIPT_ID" >/tmp/gcp-probe-clone.log 2>&1

          python3 <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['HOME']) / '.clasprc.json'
          data = json.loads(p.read_text(encoding='utf-8-sig'))
          found = []
          def walk(v):
              if isinstance(v, dict):
                  if isinstance(v.get('access_token'), str) and v.get('access_token'):
                      found.append((int(v.get('expiry_date') or 0), v['access_token']))
                  for x in v.values(): walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)
          walk(data)
          if not found:
              raise SystemExit('NO_ACCESS_TOKEN_AFTER_CLASP_CLONE')
          found.sort(key=lambda x: x[0], reverse=True)
          pathlib.Path('/tmp/access-token').write_text(found[0][1], encoding='utf-8')
          PY

          ACCESS_TOKEN="$(cat /tmp/access-token)"
          test -n "$ACCESS_TOKEN"

          CR_HTTP="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID")"
          SU_HTTP="$(curl -sS -o /tmp/service.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://serviceusage.googleapis.com/v1/projects/$PROJECT_NUMBER/services/script.googleapis.com")"
          AS_HTTP="$(curl -sS -o /tmp/script.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID")"
          TI_HTTP="$(curl -sS -o /tmp/tokeninfo.json -w '%{http_code}' \
            "https://oauth2.googleapis.com/tokeninfo?access_token=$ACCESS_TOKEN")"
          export CR_HTTP SU_HTTP AS_HTTP TI_HTTP

          python3 <<'PY' > /tmp/summary.txt
          import json, os, pathlib
          def read(path):
              try: return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except Exception: return {}
          project=read('/tmp/project.json')
          service=read('/tmp/service.json')
          script=read('/tmp/script.json')
          tokeninfo=read('/tmp/tokeninfo.json')
          def err(x):
              e=x.get('error') if isinstance(x,dict) else None
              return '' if not e else f"{e.get('status','ERROR')}:{e.get('message','')}"
          print('PROJECT_ID_EXPECTED='+os.environ['PROJECT_ID'])
          print('PROJECT_NUMBER_EXPECTED='+os.environ['PROJECT_NUMBER'])
          print('PROJECT_HTTP='+os.environ['CR_HTTP'])
          print('PROJECT_ID_ACTUAL='+str(project.get('projectId','')))
          print('PROJECT_NUMBER_ACTUAL='+str(project.get('projectNumber','')))
          print('PROJECT_LIFECYCLE='+str(project.get('lifecycleState','')))
          if err(project): print('PROJECT_ERROR='+err(project))
          print('APPS_SCRIPT_API_HTTP='+os.environ['SU_HTTP'])
          print('APPS_SCRIPT_API_STATE='+str(service.get('state','')))
          if err(service): print('APPS_SCRIPT_API_ERROR='+err(service))
          print('SCRIPT_API_HTTP='+os.environ['AS_HTTP'])
          print('SCRIPT_TITLE='+str(script.get('title','')))
          if err(script): print('SCRIPT_API_ERROR='+err(script))
          print('TOKENINFO_HTTP='+os.environ['TI_HTTP'])
          scopes=str(tokeninfo.get('scope','')).split()
          print('HAS_CLOUD_PLATFORM_SCOPE='+str('https://www.googleapis.com/auth/cloud-platform' in scopes).lower())
          print('HAS_SCRIPT_PROJECTS_SCOPE='+str('https://www.googleapis.com/auth/script.projects' in scopes).lower())
          PY

          SUMMARY="$(cat /tmp/summary.txt)"
          BODY="$(cat <<EOF
          P0=GCP_PROJECT_PROBE
          SUMMARY_BEGIN
          $SUMMARY
          SUMMARY_END
          EOF
          )"
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          printf '%s\n' "$BODY"

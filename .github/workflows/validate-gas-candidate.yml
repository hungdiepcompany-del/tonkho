name: Validate GAS Candidate

on:
  push:
    branches:
      - gas-candidate-20260820

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact validated patch hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.sha256 <<'EOF'
          5aeaa4fa06125608e03c2277fff8796516b9c05c4dc190308f176cb7ced1efc8  gmailProcessInvoiceXML.js
          585fbc2fa0b69adb60d1de3f5b84b1d897168c45744c61f62f70fe5afea44a85  hashUtils.js
          5e1eb99b477b84a4f38ed59b593f7518d7505ba91eb76f565925d2ea1e78f5d2  triggers.js
          46986e63f10f211f6a4f8268db579f99a88e4dce152ca87973e2709e88ed27f3  sheetNhapXuat.js
          ef4bf5939f8f722c7793f8edb9d59d7ed4b668a1adff2389468bc366e886c9f5  sheetTonKho.js
          ace025b72f66a2f9d41fa726b13b13eb38f5c7646be4464cece07728efffbb4f  sheetUtils.js
          dfd31795f1a45c0f14140232234a27c2839f36ea65600ac3834bc4c07eefd820  sheetSidebar.html
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256
      - name: Syntax check patched JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check gmailProcessInvoiceXML.js
          node --check hashUtils.js
          node --check triggers.js
          node --check sheetNhapXuat.js
          node --check sheetTonKho.js
          node --check sheetUtils.js
          echo CANDIDATE_VALIDATION=PASS

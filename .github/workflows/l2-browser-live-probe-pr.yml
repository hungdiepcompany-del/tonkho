name: L2 Real Browser Provider Probe

on:
  pull_request:
    branches:
      - gas-production

permissions:
  contents: read

jobs:
  browser-probe:
    name: Probe invoice links with stock Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium >/dev/null

      - name: Decrypt probe URLs in runner temp
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          DERIVED_KEY="$(printf '%s' "$CLASPRC_JSON" | sha256sum | awk '{print $1}')"
          export DERIVED_KEY
          base64 -d tests/l2-key-material/private.pem.enc.b64 > "$RUNNER_TEMP/private.pem.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/private.pem.enc" -out "$RUNNER_TEMP/private.pem" -pass env:DERIVED_KEY
          base64 -d tests/l2-key-material/easyinvoice.url.enc.b64 > "$RUNNER_TEMP/easy.enc"
          base64 -d tests/l2-key-material/misa.url.enc.b64 > "$RUNNER_TEMP/misa.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/easy.enc" -out "$RUNNER_TEMP/easy.url" -pkeyopt rsa_padding_mode:oaep
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/misa.enc" -out "$RUNNER_TEMP/misa.url" -pkeyopt rsa_padding_mode:oaep
          echo "L2_BROWSER_URL_DECRYPT=PASS"

      - name: Run stock-browser probe without challenge bypass
        shell: bash
        run: |
          set -euo pipefail
          node tests/l2-browser-probe.mjs

      - name: Destroy decrypted material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/private.pem.enc" "$RUNNER_TEMP/easy.enc" "$RUNNER_TEMP/misa.enc" "$RUNNER_TEMP/easy.url" "$RUNNER_TEMP/misa.url"
          echo "L2_BROWSER_DECRYPTED_MATERIAL_DESTROYED=1"

      - name: Upload sanitized browser report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: l2-browser-live-report
          path: l2-browser-live-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Safety closeout
        if: ${{ always() }}
        shell: bash
        run: |
          echo "L2_BROWSER_PRODUCTION_MUTATION=0"
          echo "L2_BROWSER_GMAIL_MUTATION=0"
          echo "L2_BROWSER_DRIVE_MUTATION=0"
          echo "L2_BROWSER_SHEET_MUTATION=0"
          echo "L2_BROWSER_CAPTCHA_BYPASS=0"

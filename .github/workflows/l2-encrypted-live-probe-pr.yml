name: L2 Encrypted Live Provider Probe

on:
  pull_request:
    branches:
      - gas-production

permissions:
  contents: read

jobs:
  encrypted-probe:
    name: Decrypt in RAM and probe provider responses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decrypt probe URLs without logging secrets
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          DERIVED_KEY="$(printf '%s' "$CLASPRC_JSON" | sha256sum | awk '{print $1}')"
          export DERIVED_KEY
          base64 -d tests/l2-key-material/private.pem.enc.b64 > "$RUNNER_TEMP/private.pem.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/private.pem.enc" -out "$RUNNER_TEMP/private.pem" -pass env:DERIVED_KEY
          base64 -d tests/l2-key-material/easyinvoice.url.enc.b64 > "$RUNNER_TEMP/easy.enc"
          base64 -d tests/l2-key-material/misa.url.enc.b64 > "$RUNNER_TEMP/misa.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/easy.enc" -out "$RUNNER_TEMP/easy.url" -pkeyopt rsa_padding_mode:oaep
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/misa.enc" -out "$RUNNER_TEMP/misa.url" -pkeyopt rsa_padding_mode:oaep
          test -s "$RUNNER_TEMP/easy.url"
          test -s "$RUNNER_TEMP/misa.url"
          echo "L2_URL_DECRYPT=PASS"

      - name: Run deep live HTTP probe and emit sanitized result only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe.mjs" <<'NODE'
          import fs from 'node:fs';

          const chromeHeaders = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
            'Accept': 'application/pdf,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language': 'vi-VN,vi;q=0.9,en;q=0.7',
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          };

          function sanitizeUrl(raw) {
            try {
              const u = new URL(raw);
              return {host: u.hostname, path: u.pathname, queryKeys: [...u.searchParams.keys()].sort()};
            } catch {
              return {host: 'INVALID', path: '', queryKeys: []};
            }
          }

          function magic(buf) {
            if (!buf.length) return 'EMPTY';
            if (buf.subarray(0,5).toString('latin1') === '%PDF-') return '%PDF-';
            return buf.subarray(0,8).toString('latin1').replace(/[^\x20-\x7E]/g,'.');
          }

          function cookieNames(setCookieHeaders) {
            const names = [];
            for (const c of setCookieHeaders || []) {
              const m = String(c).match(/^\s*([^=;\s]+)=/);
              if (m) names.push(m[1]);
            }
            return [...new Set(names)].sort();
          }

          function cookieHeader(setCookieHeaders) {
            return (setCookieHeaders || []).map(c => String(c).split(';',1)[0]).filter(Boolean).join('; ');
          }

          function getSetCookies(headers) {
            if (typeof headers.getSetCookie === 'function') return headers.getSetCookie();
            const one = headers.get('set-cookie');
            return one ? [one] : [];
          }

          function resolveCandidate(raw, baseUrl) {
            try {
              const decoded = String(raw || '').replace(/&amp;/gi,'&').trim();
              if (!decoded || decoded.startsWith('javascript:') || decoded.startsWith('mailto:') || decoded.startsWith('#')) return '';
              return new URL(decoded, baseUrl).href;
            } catch { return ''; }
          }

          function discoverCandidates(html, baseUrl) {
            const raw = [];
            let m;
            const attrRe = /(?:href|src|action)\s*=\s*["']([^"']+)["']/gi;
            while ((m = attrRe.exec(html)) !== null) raw.push(m[1]);
            const quotedRe = /["']([^"']{1,500}(?:download|pdf|invoice|api|tra-cuu)[^"']{0,500})["']/gi;
            while ((m = quotedRe.exec(html)) !== null) raw.push(m[1]);
            const absRe = /https?:\/\/[^\s"'<>]+/gi;
            for (const u of (html.match(absRe) || [])) raw.push(u);

            const resolved = [...new Set(raw.map(x => resolveCandidate(x, baseUrl)).filter(Boolean))];
            return resolved.filter(u => /download|pdf|invoice|api|tra-cuu|\.js(?:[?#]|$)/i.test(u)).slice(0,40);
          }

          function classifyHtml(html) {
            return {
              hasCaptchaText: /captcha|recaptcha|m[aã]\s*x[aá]c\s*th[uự]c/i.test(html),
              hasPdfText: /pdf/i.test(html),
              hasDownloadText: /download|tải\s*(hóa\s*đơn|file|pdf)/i.test(html),
              antiBotMarker: /cloudflare|cf-chl|just a moment|access denied|forbidden|bot protection|ray id/i.test(html),
              expiredMarker: /hết\s*hạn|expired|không\s*tồn\s*tại|not\s*found|invalid\s*token|token\s*invalid/i.test(html),
              loginMarker: /đăng\s*nhập|login|sign\s*in/i.test(html)
            };
          }

          async function fetchOnce(label, rawUrl, headers={}) {
            const started = Date.now();
            const res = await fetch(rawUrl, {redirect:'follow', headers});
            const buf = Buffer.from(await res.arrayBuffer());
            const ct = res.headers.get('content-type') || '';
            const cd = res.headers.get('content-disposition') || '';
            const pdfMagic = buf.subarray(0,5).toString('latin1') === '%PDF-';
            const setCookies = getSetCookies(res.headers);
            const item = {
              label,
              source:sanitizeUrl(rawUrl),
              httpStatus:res.status,
              contentType:ct,
              hasContentDisposition:Boolean(cd),
              contentDispositionMentionsPdf:/\.pdf/i.test(cd),
              bytes:buf.length,
              firstBytes:magic(buf),
              pdfMagic,
              final:sanitizeUrl(res.url),
              elapsedMs:Date.now()-started,
              serverHeader:res.headers.get('server') || '',
              hasCfRay:Boolean(res.headers.get('cf-ray')),
              setCookieNames:cookieNames(setCookies)
            };
            if (/text\/html/i.test(ct) || (!pdfMagic && buf.length < 5_000_000)) {
              const html = buf.toString('utf8');
              const rawCandidates = discoverCandidates(html, res.url);
              item.html = classifyHtml(html);
              item.candidateCount = rawCandidates.length;
              item.candidates = rawCandidates.map(sanitizeUrl);
              item._rawCandidates = rawCandidates;
              item._setCookies = setCookies;
            } else {
              item._rawCandidates = [];
              item._setCookies = setCookies;
            }
            return item;
          }

          function publicItem(item) {
            const x = {...item};
            delete x._rawCandidates;
            delete x._setCookies;
            return x;
          }

          async function easyInvoiceChain(downloadUrl) {
            const results = [];
            const direct = await fetchOnce('direct_default', downloadUrl, {});
            results.push(publicItem(direct));

            const browser = await fetchOnce('direct_chrome', downloadUrl, chromeHeaders);
            results.push(publicItem(browser));
            if (browser.pdfMagic) return results;

            const u = new URL(downloadUrl);
            const viewUrl = new URL(u.href);
            viewUrl.pathname = viewUrl.pathname.replace(/\/DownloadInvPdf$/i, '/ViewFromEmail');
            const view = await fetchOnce('view_chrome', viewUrl.href, {...chromeHeaders, Referer:u.origin + '/'});
            results.push(publicItem(view));

            const cookies = cookieHeader(view._setCookies);
            const sessionHeaders = {...chromeHeaders, Referer:viewUrl.href};
            if (cookies) sessionHeaders.Cookie = cookies;
            const afterView = await fetchOnce('download_after_view_session', downloadUrl, sessionHeaders);
            results.push(publicItem(afterView));
            if (afterView.pdfMagic) return results;

            const candidatePool = [...new Set([...(browser._rawCandidates||[]), ...(view._rawCandidates||[]), ...(afterView._rawCandidates||[])])]
              .filter(x => {
                try {
                  const cu = new URL(x);
                  return cu.hostname === u.hostname && /download|pdf|invoice/i.test(cu.pathname + cu.search);
                } catch { return false; }
              })
              .slice(0,8);

            for (let i=0; i<candidatePool.length; i++) {
              const candidate = await fetchOnce(`candidate_${i+1}`, candidatePool[i], sessionHeaders);
              results.push(publicItem(candidate));
              if (candidate.pdfMagic) break;
            }
            return results;
          }

          async function misaChain(lookupUrl) {
            const results = [];
            const direct = await fetchOnce('direct_default', lookupUrl, {});
            results.push(publicItem(direct));
            const browser = await fetchOnce('direct_chrome', lookupUrl, {...chromeHeaders, Referer:'https://www.meinvoice.vn/tra-cuu/'});
            results.push(publicItem(browser));
            if (browser.pdfMagic || browser.httpStatus !== 200) return results;

            const cookies = cookieHeader(browser._setCookies);
            const sessionHeaders = {...chromeHeaders, Referer:lookupUrl};
            if (cookies) sessionHeaders.Cookie = cookies;
            const repeat = await fetchOnce('repeat_with_session', lookupUrl, sessionHeaders);
            results.push(publicItem(repeat));
            if (repeat.pdfMagic) return results;

            const base = new URL(lookupUrl);
            const candidates = [...new Set([...(browser._rawCandidates||[]), ...(repeat._rawCandidates||[])])]
              .filter(x => {
                try {
                  const u = new URL(x);
                  return u.hostname === base.hostname && /download|pdf|invoice|api/i.test(u.pathname + u.search);
                } catch { return false; }
              })
              .slice(0,8);
            for (let i=0; i<candidates.length; i++) {
              const r = await fetchOnce(`candidate_${i+1}`, candidates[i], sessionHeaders);
              results.push(publicItem(r));
              if (r.pdfMagic) break;
            }
            return results;
          }

          const easy = fs.readFileSync(process.env.RUNNER_TEMP + '/easy.url','utf8').trim();
          const misa = fs.readFileSync(process.env.RUNNER_TEMP + '/misa.url','utf8').trim();
          const report = {
            mode:'LIVE_HTTP_READ_ONLY_DEEP',
            productionMutation:false,
            gmailMutation:false,
            driveMutation:false,
            sheetMutation:false,
            providers:[]
          };

          try {
            const attempts = await easyInvoiceChain(easy);
            report.providers.push({provider:'EASYINVOICE', attempts});
            const pass = attempts.some(x => x.pdfMagic);
            console.log('EASYINVOICE_PDF_RETRIEVED=' + (pass ? 'PASS' : 'NO'));
            for (const a of attempts) console.log(`EASYINVOICE_${a.label}_STATUS=${a.httpStatus};CT=${a.contentType || 'NONE'};PDF=${a.pdfMagic ? 'YES':'NO'};PATH=${a.final.path}`);
          } catch (e) {
            report.providers.push({provider:'EASYINVOICE', error:String(e?.message||e)});
            console.log('EASYINVOICE_CHAIN=ERROR');
          }

          try {
            const attempts = await misaChain(misa);
            report.providers.push({provider:'MISA', attempts});
            const pass = attempts.some(x => x.pdfMagic);
            console.log('MISA_PDF_RETRIEVED=' + (pass ? 'PASS' : 'NO'));
            for (const a of attempts) console.log(`MISA_${a.label}_STATUS=${a.httpStatus};CT=${a.contentType || 'NONE'};PDF=${a.pdfMagic ? 'YES':'NO'};PATH=${a.final.path};CF=${a.hasCfRay ? 'YES':'NO'}`);
          } catch (e) {
            report.providers.push({provider:'MISA', error:String(e?.message||e)});
            console.log('MISA_CHAIN=ERROR');
          }

          report.status='COMPLETED';
          fs.writeFileSync('l2-encrypted-live-report-v2.json',JSON.stringify(report,null,2));
          NODE
          node "$RUNNER_TEMP/probe.mjs"

      - name: Destroy decrypted secrets from runner temp
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/private.pem.enc" "$RUNNER_TEMP/easy.enc" "$RUNNER_TEMP/misa.enc" "$RUNNER_TEMP/easy.url" "$RUNNER_TEMP/misa.url"
          echo "L2_DECRYPTED_MATERIAL_DESTROYED=1"

      - name: Upload sanitized report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: l2-encrypted-live-report-v2
          path: l2-encrypted-live-report-v2.json
          if-no-files-found: error
          retention-days: 3

      - name: Safety closeout
        if: ${{ always() }}
        shell: bash
        run: |
          echo "L2_PROBE_PRODUCTION_MUTATION=0"
          echo "L2_PROBE_GMAIL_MUTATION=0"
          echo "L2_PROBE_DRIVE_MUTATION=0"
          echo "L2_PROBE_SHEET_MUTATION=0"
